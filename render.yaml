services:
  - type: web
    name: allen-stock-web-v1
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_USERNAME
        value: allen
      - key: APP_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.deepseek.com
      - key: AI_MODEL
        value: deepseek-chat
      - key: FORECAST_API_URL
        sync: false
      - key: FORECAST_API_TOKEN
        sync: false
      - key: FORECAST_TIMEOUT_MS
        value: "55000"
  - type: web
    name: allen-forecast-model
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: pip install -r predictor-requirements.txt
    startCommand: uvicorn predictor_service:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CHRONOS_MODEL
        value: amazon/chronos-bolt-tiny
      - key: FORECAST_API_TOKEN
        sync: false
