name: Train LightGBM rankers

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Historical data start date
        required: true
        default: "2018-01-01"
      universe_limit:
        description: "Pilot size; use 0 for full CSI 300 + CSI 500"
        required: true
        default: "0"

permissions:
  contents: write

concurrency:
  group: lightgbm-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install training dependencies
        run: python -m pip install --upgrade pip && pip install -r ml/requirements.txt

      - name: Build point-in-time price dataset
        run: |
          python ml/build_baostock_dataset.py \
            --start "${{ inputs.start_date }}" \
            --limit "${{ inputs.universe_limit }}" \
            --output /tmp/baostock-csi800.parquet

      - name: Train and validate 5, 20 and 60-day rankers
        run: python ml/train_ranker.py /tmp/baostock-csi800.parquet --output models

      - name: Preserve dataset audit metadata
        run: cp /tmp/baostock-csi800.metadata.json models/training-data.metadata.json

      - name: Upload audit bundle
        uses: actions/upload-artifact@v4
        with:
          name: allen-lightgbm-training-audit
          path: |
            models/model-manifest.json
            models/training-data.metadata.json
          retention-days: 30

      - name: Commit validated outputs or safe fallback manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/model-manifest.json models/training-data.metadata.json models/lambdarank-*.json
          git diff --cached --quiet && exit 0
          git commit -m "Train LightGBM rankers from BaoStock history"
          git push
