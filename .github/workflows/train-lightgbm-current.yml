name: Train LightGBM with recent market data

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Historical data start date
        required: true
        default: "2016-01-01"
      universe_limit:
        description: "Pilot size; use 0 for full CSI 300 + CSI 500 union"
        required: true
        default: "0"
      transaction_cost_bps:
        description: Estimated round-trip transaction cost in basis points
        required: true
        default: "30"

permissions:
  contents: write

concurrency:
  group: lightgbm-current-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install training dependencies
        run: python -m pip install --upgrade pip && pip install -r ml/requirements.txt

      - name: Verify training feature contract
        run: python -m unittest discover -s ml -p "test_*.py"

      - name: Download Microsoft Qlib instrument universe
        run: |
          git clone --depth 1 https://github.com/microsoft/qlib.git /tmp/qlib-source
          python /tmp/qlib-source/scripts/get_data.py qlib_data \
            --target_dir /tmp/qlib-data/cn_data \
            --region cn \
            --interval 1d

      - name: Build recent Yahoo research dataset
        run: |
          python ml/build_yahoo_dataset.py \
            --provider /tmp/qlib-data/cn_data \
            --start "${{ inputs.start_date }}" \
            --limit "${{ inputs.universe_limit }}" \
            --output /tmp/yahoo-csi800.parquet

      - name: Train and walk-forward validate 5, 20 and 60-day rankers
        run: |
          python ml/train_ranker.py /tmp/yahoo-csi800.parquet \
            --output models \
            --walk-forward-folds 3 \
            --round-trip-cost-bps "${{ inputs.transaction_cost_bps }}"

      - name: Preserve dataset audit metadata
        run: cp /tmp/yahoo-csi800.metadata.json models/training-data.metadata.json

      - name: Upload validation audit bundle
        uses: actions/upload-artifact@v4
        with:
          name: allen-lightgbm-current-training-audit
          path: |
            models/model-manifest.json
            models/training-data.metadata.json
          retention-days: 30

      - name: Commit models and validation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/model-manifest.json models/training-data.metadata.json models/lambdarank-*.json
          git diff --cached --quiet && exit 0
          git commit -m "Train LightGBM with recent walk-forward data"
          git pull --rebase origin main
          git push
