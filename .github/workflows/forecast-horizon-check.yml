name: 短线概率校验

on:
  push:
    branches:
      - fix/forecast-horizon-v1
    paths:
      - '**/*.js'
      - package.json
      - package-lock.json
      - .github/workflows/forecast-horizon-check.yml

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_ENV: test
      DATABASE_URL: ''
      AI_API_KEY: ''
      FORECAST_API_URL: ''
    steps:
      - name: 读取当前分支代码
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: 准备 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 安装项目依赖但不运行安装脚本
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: 运行项目现有 Node 检查
        run: |
          node --version
          npm run check
