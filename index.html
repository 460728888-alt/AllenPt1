<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b172a">
  <title>Allen · 机会演化研究台</title>
  <link rel="stylesheet" href="/styles.css?v=1.15.0">
  <link rel="stylesheet" href="/workbench.css?v=2.0.0">
</head>
<body>
  <section id="login" class="login-screen">
    <form id="loginForm" class="login-card">
      <div class="logo">A</div>
      <p class="eyebrow">PRIVATE INVESTMENT INTELLIGENCE</p>
      <h1>Allen · 机会演化研究台</h1>
      <p class="muted">发现值得关注的机会，让每个判断有据可查。</p>
      <label>账号<input id="username" value="allen" autocomplete="username"></label>
      <label>密码<input id="password" type="password" autocomplete="current-password"></label>
      <button class="primary wide" type="submit">进入研究系统</button>
      <p id="loginError" class="error"></p>
    </form>
  </section>

  <div id="shell" class="shell hidden">
    <aside class="sidebar">
      <div class="brand"><span class="logo small">A</span><div><b>Allen 机会研究</b><small>PRIVATE AI RESEARCH</small></div></div>
      <nav id="nav"></nav>
      <div class="sidebar-foot"><div class="status-dot pending"></div><span>数据以页面核验状态为准</span><button id="logoutBtn">退出</button></div>
    </aside>
    <main>
      <header><button id="menuBtn" class="menu" aria-label="展开导航">☰</button><div><p id="breadcrumb" class="eyebrow">OVERVIEW</p><h1 id="pageTitle">今日概览</h1></div><div class="header-actions"><span id="clock"></span><button class="icon-btn" data-go="search" aria-label="搜索股票">⌕</button></div></header>
      <div id="content" class="content"></div>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <script src="/research-workbench.js?v=2.0.0" defer></script>
  <script src="/app.js?v=2.0.0" defer></script>
</body>
</html>
